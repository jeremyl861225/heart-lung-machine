.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}

.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}

.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}

.iso-line[data-dashed]{stroke-dasharray:3 3}

.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}

.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}

.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}

.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate .iso-svg{margin:0 auto}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

  --cpb-arterial-shade: #6e1219;
}
.iso[data-theme="light"] {
  --cpb-lcd: #e3ebe5;

  --cpb-venous-shine: #a4485a;
  --cpb-venous-shade: #5c1828;

}
.cpb-lcd { fill: var(--cpb-lcd); stroke: none; }

.cpb-v .tb-body { fill: var(--cpb-venous); }
.cpb-v .tb-shine { fill: var(--cpb-venous-shine); }
.cpb-v .tb-shade { fill: var(--cpb-venous-shade); }
.cpb-a .tb-body { fill: var(--cpb-arterial); }
.cpb-a .tb-shine { fill: var(--cpb-arterial-shine); }
.cpb-a .tb-shade { fill: var(--cpb-arterial-shade); }
.cpb-stage { position: relative; touch-action: pan-y; user-select: none; -webkit-user-select: none; outline: none; }
.cpb-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.iso-plate { padding: 52px 24px 64px; overflow: hidden; }
.cpb-blood > .iso-fill, .cpb-blood > .iso-top { fill: var(--cpb-venous-shine); }

.cpb-swatch-v path { stroke: var(--cpb-venous); stroke-width: 3; }
.cpb-swatch-a path { stroke: var(--cpb-arterial); stroke-width: 3; }
.cpb-head { margin: 0 0 8px; }
.cpb-head h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.3; color: var(--anatomy-strong); font-weight: 600; letter-spacing: .01em; }
.cpb-head p { margin: 0; color: var(--anatomy-text); font-size: 14px; line-height: 1.7; max-width: 60em; }
@media (max-width: 560px) {

.iso { --cpb-cp: #3d6fb0; --cpb-cp-shine: #5a8ad0; --cpb-cp-shade: #284d80; }

.cpb-c .tb-body { fill: var(--cpb-cp); }
.cpb-c .tb-shine { fill: var(--cpb-cp-shine); }

.cpb-swatch-c path { stroke: var(--cpb-cp); stroke-width: 3; }

.cpb-back { margin: 0 0 10px !important; font-size: 13px !important; }
.cpb-back a { color: var(--anatomy-muted); text-decoration: none; }
.cpb-back a:hover { text-decoration: underline; }
</style><header class="cpb-head"><p class="cpb-back"><a href="./">← 回到目錄</a></p><h1>人工心肺機：四個泵與插管位置</h1><p>體外循環 (cardiopulmonary bypass) 的四個滾輪泵各管一條路：動脈泵送氧合血回升主動脈、心麻痺液泵灌主動脈根部、左心減壓泵從右上肺靜脈抽左心室、抽吸泵回收心包腔出血。右側標示板標出每條管路接在病人身上的位置。在圖上左右拖曳或用方向鍵調整動脈泵轉速；點其他泵頭（或按 C／V／S）開關心麻痺液泵、左心減壓泵、抽吸泵。</p></header><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">人工心肺機 · heart-lung machine</span><span class="iso-plate-corner" data-corner="hint">拖曳 ← → 動脈泵 · 點泵頭開關</span><span class="iso-plate-corner" data-corner="readout" data-readout>停機 · 0 rpm · 0.00 L/min · CI 0.00</span></div><div class="iso-stage cpb-stage" tabindex="0" role="slider" aria-label="人工心肺機：左右方向鍵調整動脈泵轉速（按住 Shift 一次 10 rpm），Home 全部停機，End 動脈泵全流量；C、V、S 分別開關心麻痺液泵、左心減壓泵、抽吸泵；在圖上左右拖曳也可調整動脈泵轉速，點其他泵頭可開關" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0" aria-valuetext="停機"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 960 820" role="img" aria-label="人工心肺機 (heart-lung machine) 的等角剖析圖：推車式主機上一排四個滾輪泵 (roller pump)——抽吸泵、左心減壓泵、心麻痺液泵、動脈泵；立柱上掛著硬殼靜脈儲血槽、膜式氧合器、動脈過濾器與氣體混合器，旁邊是心麻痺液袋與熱交換器、變溫水箱。右側標示板列出各條管路接到病人身上的位置：升主動脈、主動脈根部、右心房、右上肺靜脈到左心室、心包腔。"><path class="iso-halo" d="M51.3 519.6L51.9 517.9L53.2 516.3L55.2 514.9L210.8 421.4L213.3 420.2L216.3 419.2L219.6 418.5L223.2 418.1L226.8 418.1L230.4 418.4L233.8 419L236.9 419.9L901.6 663.7L904.2 664.9L906.3 666.3L907.8 667.9L908.6 669.5L908.7 671.2L908.7 690.9L908.1 692.6L906.8 694.2L904.8 695.6L749.2 789.1L746.7 790.4L743.7 791.3L740.4 792L736.8 792.4L733.2 792.5L729.6 792.2L726.2 791.5L723.1 790.6L58.4 546.8L55.8 545.6L53.7 544.2L52.2 542.7L51.4 541L51.3 539.3Z"/><g class="iso-solid"><path class="iso-fill" d="M215 461L215.4 459.5L216.4 458L218.2 456.7L220.5 455.6L223.3 454.7L226.4 454.2L229.8 454L233.1 454.1L236.2 454.6L239.1 455.5L241.4 456.6L243.2 457.9L244.4 459.3L244.8 460.9L244.8 463.5L244.4 465.1L243.4 466.6L241.6 46  237.1L829.1 237.3L829.1 237.3L828.6 237.4L828.1 237.4L718 197L717.7 196.7L717.8 196.5L717.8 196.5L718.3 196.4L718.9 196.4Z"/><path class="iso-line iso-crease" data-tone="faint" d="M829.3 237.1L829.1 237.3M829.1 237.3L828.6 237.4L828.1 237.4L718 197L717.7 196.7"/><path class="iso-line iso-bevel" data-tone="faint" d="M829.3 237.1L829.1 237.3M829.1 237.3L828.6 237.3L828.2 237.2L718.2 196.9L717.7 196.7"/><path class="iso-line iso-edge" data-tone="mid" d="M829.1 237.3L829.1 237.3M717.7 196.7L717.8 196.5L717.8 196.5L718.3 196.4L718.9 196.4L829 236.8L829.3 237.1M829.3 256.7L829.1 257M829.1 257L828.6 257.1L828.1 257.1L718 216.7L717.7 216.4M829.3 237.1L829.3 256.7M829.1 237.3L829.1 257M829.1 237.3L829.1 257M717.7 196.7L717.7 216.4"/></g><text class="iso-face-text" data-tone="hi" transform="matrix(1.464 0.537 0 1.641 721.189 207.022)" font-size="5.6" text-anchor="start">心包腔</text><text class="iso-face-text" data-tone="hi" transform="matrix(1.464 0.537 0 1.641 721.189 215.225)" font-size="3.8" text-anchor="start">Pericardial field</text></g></svg></div></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>動脈泵轉子 (rotor)：每轉 52.7 mL</span><span class="iso-key"><svg class="iso-swatch cpb-swatch-v" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>靜脈血 (deoxygenated)：右心房、左心減壓、心包腔抽吸 → 儲血槽 → 動脈泵 → 氧合器</span><span class="iso-key"><svg class="iso-swatch cpb-swatch-a" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>動脈血 (oxygenated)：氧合器 → 過濾器 → 升主動脈</span><span class="iso-key"><svg class="iso-swatch cpb-swatch-c" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>心麻痺液 (cardioplegia)：液袋 → 心麻痺液泵 → 熱交換器 → 主動脈根部</span></span><span class="iso-caption">人工心肺機 (heart-lung machine) 在體外循環 (cardiopulmonary bypass, CPB) 時暫代心與肺。四個滾輪泵 (roller pump) 由左到右：抽吸泵 (cardiotomy sucker) 把心包腔的出血吸回儲血槽；左心減壓泵 (LV vent) 經右上肺靜脈 (right superior pulmonary vein, RSPV) 放進左心室的導管抽血減壓，同樣回到儲血槽；心麻痺液泵 (cardioplegia pump) 把液袋裡的心麻痺液推過熱交換器與氣泡過濾 (heat exchanger / bubble trap)，從主動脈根部 (aortic root) 順行灌進冠狀動脈；動脈泵 (arterial pump) 從靜脈儲血槽 (venous reservoir) 抽血，推過膜式氧合器 (membrane oxygenator)——氣體混合器 (gas blender) 送進掃氣 (sweep gas)，變溫水箱 (heater-cooler) 的水流過內建熱交換器控制血溫——再經動脈過濾器 (arterial filter) 由主動脈插管 (aortic cannula) 送回升主動脈 (ascending aorta)。靜脈血則靠重力從右心房經靜脈插管 (venous cannula) 流回儲血槽。滾輪泵是完全壓閉式 (occlusive)：每轉推出一整圈管腔，π × (管內半徑)² × 2π × 管路中心半徑。動脈泵 1/2 吋管在 150 mm 滾道每轉 52.7 mL；其餘三泵 1/4 吋管在 85 mm 滾道每轉 7.5 mL。以體表面積 (body surface area, BSA) 1.8 m²、心指數 (cardiac index, CI) 2.4 L/min/m² 計，全流量 4.32 L/min 約需 82 rpm；導覽中減壓泵 30 rpm（0.23 L/min）、抽吸泵 25 rpm（0.19 L/min）、心麻痺液 40 rpm（0.30 L/min）。此圖以晶體心麻痺液 (crystalloid cardioplegia) 為例；血液心麻痺液 (blood cardioplegia) 會另從氧合器出口取氧合血，與晶體液以約 4:1 在同一泵頭混合。逆行灌注則改接冠狀竇 (coronary sinus)。儲血槽液面是簡化模型：假設靜脈回流以 4 秒時間常數追上進入病人的量，差額暫存在病人血管內；灌心麻痺液時晶體液會讓液面慢慢升高。實際每轉排出量依管路與壓閉度校正，臨床流量與灌注目標依各院體外循環常規。</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;

function signedArea(points) {

    for (let index = 0; index < points.length; index++) {

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {
        while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], point) <= 0)
            lower.pop();
        lower.push(point);
    }
    const upper = [];
    for (let index = sorted.length - 1; index >= 0; index--) {
        const point = sorted[index];
        while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], point) <= 0)
            upper.pop();
        upper.push(point);
    }
    return [...lower.slice(0, -1), ...upper.slice(0, -1)];
}
function runsOf(flags, want) {
    const count = flags.length;
    const runs = [];
    const start = flags.findIndex((flag, index) => flag !== flags[(index + count - 1) % count]);
    if (start < 0)
        return flags[0] === want ? [Array.from({ length: count + 1 }, (_, index) => index % count)] : [];
    let run = null;
    for (let step = 0; step < count; step++) {
        const index = (start + step) % count;
        if (flags[index] === want) {
            if (!run)
                run = [index];
            run.push((index + 1) % count);
        }
        else if (run) {
            runs.push(run);

    return runs;
}
function extrude(ring, z, height, projection, options = {}) {
    const convex = options.convex ?? true;

    const counter = signedArea(ring) > 0;
    const [vx, vy] = towardViewer(projection);
    const { sinA, cosA } = cameraOf(projection);
    const normals = ring.map(([ax, ay], index) => {
        const [bx, by] = ring[(index + 1) % count];
        const dx = bx - ax;
        const dy = by - ay;
        const length = Math.hypot(dx, dy) || 1;
        return (counter ? [dy / length, -dx / length] : [-dy / length, dx / length]);
